services:
  - type: web
    name: merix-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen
    # Apply pending migrations before booting the app. Render Pre-Deploy Commands
    # require a paid instance type; once the plan is upgraded, move this to:
    #   preDeployCommand: uv run alembic upgrade head
    startCommand: uv run alembic upgrade head && uv run uvicorn merix.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: APP_NAME
        value: Merix
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: google
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_API_KEY
        sync: false
      - key: STORAGE_PROVIDER
        value: supabase
      - key: STORAGE_BUCKET
        value: resumes
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
