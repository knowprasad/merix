name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "chore/**", "refactor/**", "docs/**"]
  pull_request:
    branches: [main]
  # Full integration suite also runs nightly so slow-suite regressions
  # surface even when nothing merges for a while.
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Two tiers:
#   Fast tier (every push/PR): lint + unit tests + migration drift — ~2 min.
#   Full tier (push to main / nightly): the DB-backed integration suite,
#   running against an ephemeral pgvector container (no shared-DB contention).
jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies (dev group)
        run: uv sync --group dev

      - name: Run ruff lint check
        run: uv run ruff check src/ tests/

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/

  unit-tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend

    env:
      APP_NAME: Merix
      ENVIRONMENT: ci
      DEBUG: "false"
      LOG_LEVEL: WARNING
      LLM_PROVIDER: groq
      LLM_MODEL: openai/gpt-oss-120b
      LLM_API_KEY: ""
      EMBEDDING_PROVIDER: google
      EMBEDDING_MODEL: gemini-embedding-001
      EMBEDDING_API_KEY: ""
      STORAGE_PROVIDER: supabase
      STORAGE_BUCKET: resumes

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install all dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: uv run pytest tests/unit -v --tb=short

  integration-tests:
    name: Integration tests (container Postgres)
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    # Slow-ish, network-independent suite: runs against a fresh ephemeral
    # pgvector container (provisioned automatically by
    # tests/integration/conftest.py). Only gates main deploys and the nightly
    # run; branches get the fast tier instead.
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: backend

    # Real Postgres + pgvector in a disposable container — exercises the same
    # RLS/org-isolation behaviour as hosted Postgres without any network or
    # shared-database contention. Schema is built from scratch each run.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: merix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Application settings
      APP_NAME: Merix
      ENVIRONMENT: ci
      DEBUG: "false"
      LOG_LEVEL: WARNING

      # Ephemeral container database; tests/integration/conftest.py enables
      # the vector extension and applies all migrations before the suite.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/merix_test

      # LLM/embedding keys — tests use FakeLLM/FakeEmbedder; only empty strings are needed.
      LLM_PROVIDER: groq
      LLM_MODEL: openai/gpt-oss-120b
      LLM_API_KEY: ""
      EMBEDDING_PROVIDER: google
      EMBEDDING_MODEL: gemini-embedding-001
      EMBEDDING_API_KEY: ""

      # Storage — not exercised by tests; kept non-empty to satisfy pydantic-settings.
      STORAGE_PROVIDER: supabase
      STORAGE_BUCKET: resumes
      SUPABASE_URL: ""

      # Auth — tests mint HS256 tokens locally with a test-only secret.
      # (helpers.py falls back to one when this is empty.)
      SUPABASE_JWT_SECRET: ""
      JWT_ALGORITHM: HS256

      # DPDP / admin
      ADMIN_API_TOKEN: ""
      ALLOWED_ORIGINS: "*"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install all dependencies
        run: uv sync --group dev

      - name: Run pytest
        run: uv run pytest tests/integration -v --tb=short 2>&1

  migration-drift:
    name: Migration drift (alembic check)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend

    # Ephemeral Postgres with pgvector preinstalled (models/migrations use the
    # vector type). Fresh database every run: proves migrations build the full
    # schema from scratch and that no model change is missing a migration.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drift_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/drift_check

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install all dependencies
        run: uv sync --group dev

      # No migration creates the extension (it was provisioned manually on
      # Supabase), so create it here before migrating — same as prod setup.
      # Filter by image ancestor: Actions names the service container after
      # the image slug, not "postgres" ("postgres" is only its network alias).
      - name: Enable pgvector extension
        run: |
          docker exec "$(docker ps -qf ancestor=pgvector/pgvector:pg16)" psql -U postgres -d drift_check \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Apply all migrations to empty database
        run: uv run alembic upgrade head

      # Fails the build when model changes lack a corresponding migration
      # (same comparison autogenerate uses). Limitation: it cannot catch what
      # autogenerate cannot see (e.g. enum value changes, data migrations).
      - name: Check models match migrated schema
        run: uv run alembic check
